<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agent Chat</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section {
            margin-bottom: 30px;
        }

        #messages,
        #pending-cases {
            border: 1px solid #ccc;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            border-radius: 6px;
        }

        .message,
        .pending-case {
            padding: 12px;
            margin-bottom: 12px;
            background: #f2f2f2;
            border-radius: 5px;
        }

        .pending-case {
            border-left: 4px solid #e89b18;
        }

        .message-type {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .message-text {
            margin-bottom: 10px;
        }

        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        /* Reduced-size image thumbnails */
        .case-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border: 1px solid #aaa;
            border-radius: 5px;
            cursor: pointer;
        }

        .case-image:hover {
            opacity: 0.85;
        }

        #input {
            width: 70%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .refresh-button {
            margin-bottom: 10px;
        }

        .answer-section {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .answer-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-answer-button {
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .submit-answer-button:hover {
            background-color: #125ca1;
        }

        .loading {
            color: #555;
        }

        .error {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
        }

        .success {
            color: #1b5e20;
            background: #e8f5e9;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .submission-error {
            color: #c62828;
            background: #ffebee;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .empty-message {
            color: #777;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Agent Chat Section -->
    <div class="section">
        <h1>Agent</h1>

        <div id="messages"></div>

        <br>

        <input
            id="input"
            type="text"
            placeholder="Enter message"
        >

        <button onclick="sendMessage()">
            Send
        </button>
    </div>

    <!-- Pending Cases Section -->
    <div class="section">
        <h2>Pending Cases</h2>

        <button
            class="refresh-button"
            onclick="getPendingCases()"
        >
            Refresh Pending Cases
        </button>

        <div id="pending-cases">
            <div class="loading">
                Loading pending cases...
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:8000";

        const socket = new WebSocket(
            "ws://localhost:8000/ws"
        );

        // Server to Browser
        socket.onmessage = function (event) {
            const messages =
                document.getElementById("messages");

            let data;

            try {
                data = JSON.parse(event.data);
            } catch (error) {
                console.error(
                    "Invalid WebSocket response:",
                    error
                );
                return;
            }

            const messageCard = createCaseCard(
                data,
                "message",
                false
            );

            messages.appendChild(messageCard);

            messages.scrollTop = messages.scrollHeight;
        };

        // Browser to Server
        function sendMessage() {
            const input =
                document.getElementById("input");

            const message = input.value.trim();

            if (!message) {
                return;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                alert("WebSocket is not connected.");
                return;
            }

            const data = {
                type: "Validation",
                message: message
            };

            socket.send(JSON.stringify(data));

            input.value = "";

            document.getElementById(
                "messages"
            ).innerHTML = "";
        }

        // Send WebSocket message using Enter
        document
            .getElementById("input")
            .addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });

        socket.onopen = function () {
            socket.send(
                JSON.stringify({
                    type: "iniatiate_cc",
                    message: "This is for initiation"
                })
            );

            console.log("WebSocket connected");
        };

        socket.onclose = function () {
            console.log("WebSocket disconnected");
        };

        socket.onerror = function (error) {
            console.error("WebSocket error:", error);
        };

        /*
         * Fetch all pending cases.
         */
        async function getPendingCases() {
            const pendingCasesContainer =
                document.getElementById("pending-cases");

            pendingCasesContainer.innerHTML =
                '<div class="loading">' +
                'Loading pending cases...' +
                '</div>';

            try {
                const response = await fetch(
                    `${API_BASE_URL}/get-pending-cases`,
                    {
                        method: "GET",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `Request failed with status ${response.status}`
                    );
                }

                const pendingCases = await response.json();

                pendingCasesContainer.innerHTML = "";

                if (
                    !Array.isArray(pendingCases) ||
                    pendingCases.length === 0
                ) {
                    pendingCasesContainer.innerHTML =
                        '<div class="empty-message">' +
                        'No pending cases found.' +
                        '</div>';

                    return;
                }

                pendingCases.forEach(function (pendingCase) {
                    const caseCard = createCaseCard(
                        pendingCase,
                        "pending-case",
                        true
                    );

                    pendingCasesContainer.appendChild(
                        caseCard
                    );
                });
            } catch (error) {
                console.error(
                    "Failed to get pending cases:",
                    error
                );

                pendingCasesContainer.innerHTML = "";

                const errorElement =
                    document.createElement("div");

                errorElement.className = "error";

                errorElement.textContent =
                    "Unable to load pending cases: " +
                    error.message;

                pendingCasesContainer.appendChild(
                    errorElement
                );
            }
        }

        /*
         * Render WebSocket messages and pending cases.
         *
         * showAnswerInput is true only for pending cases.
         */
        function createCaseCard(
            data,
            className = "message",
            showAnswerInput = false
        ) {
            const card = document.createElement("div");
            card.className = className;

            /*
             * Store the thread ID in the HTML element.
             * It is not displayed to the user.
             */
            if (data.threadID) {
                card.dataset.threadId = data.threadID;
            }

            const typeElement =
                document.createElement("div");

            typeElement.className = "message-type";

            typeElement.textContent =
                "Type: " + (data.type || "Unknown");

            card.appendChild(typeElement);

            const messageElement =
                document.createElement("div");

            messageElement.className = "message-text";

            messageElement.textContent =
                data.message || "No message provided";

            card.appendChild(messageElement);

            // Display evidence images
            if (
                Array.isArray(data.images) &&
                data.images.length > 0
            ) {
                const imagesContainer =
                    document.createElement("div");

                imagesContainer.className =
                    "images-container";

                data.images.forEach(function (
                    imageBase64,
                    index
                ) {
                    const image =
                        document.createElement("img");

                    image.className = "case-image";

                    image.alt =
                        "Evidence image " + (index + 1);

                    if (
                        imageBase64.startsWith("data:image/")
                    ) {
                        image.src = imageBase64;
                    } else {
                        image.src =
                            "data:image/png;base64," +
                            imageBase64;
                    }

                    image.onclick = function () {
                        window.open(image.src, "_blank");
                    };

                    imagesContainer.appendChild(image);
                });

                card.appendChild(imagesContainer);
            }

            /*
             * Add answer input only to pending-case cards.
             */
            if (showAnswerInput) {
                createAnswerSection(
                    card,
                    data.threadID
                );
            }

            return card;
        }

        /*
         * Create the answer textbox and submit button
         * for an individual pending case.
         */
        function createAnswerSection(card, threadID) {
            const answerSection =
                document.createElement("div");

            answerSection.className = "answer-section";

            const answerInput =
                document.createElement("input");

            answerInput.type = "text";
            answerInput.className = "answer-input";

            answerInput.placeholder =
                "Enter your answer for this case";

            const submitButton =
                document.createElement("button");

            submitButton.className =
                "submit-answer-button";

            submitButton.textContent = "Submit Answer";

            submitButton.onclick = function () {
                submitPendingAnswer(
                    threadID,
                    answerInput,
                    submitButton,
                    card
                );
            };

            // Submit the answer using Enter
            answerInput.addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        submitButton.click();
                    }
                }
            );

            answerSection.appendChild(answerInput);
            answerSection.appendChild(submitButton);

            card.appendChild(answerSection);
        }

        /*
         * Send the pending-case answer to FastAPI.
         *
         * Request body:
         * {
         *     "threadID": "...",
         *     "answer": "..."
         * }
         */
        async function submitPendingAnswer(
            threadID,
            answerInput,
            submitButton,
            card
        ) {
            const answer = answerInput.value.trim();

            // Remove an earlier status message
            const previousStatus =
                card.querySelector(".submission-status");

            if (previousStatus) {
                previousStatus.remove();
            }

            if (!threadID) {
                showSubmissionStatus(
                    card,
                    "Thread ID is missing for this pending case.",
                    false
                );
                return;
            }

            if (!answer) {
                showSubmissionStatus(
                    card,
                    "Please enter an answer before submitting.",
                    false
                );

                answerInput.focus();
                return;
            }

            submitButton.disabled = true;
            answerInput.disabled = true;
            submitButton.textContent = "Submitting...";

            const requestData = {
                threadID: threadID,
                answer: answer
            };

            try {
                const response = await fetch(
                    `${API_BASE_URL}/handle-pending-cases`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(requestData)
                    }
                );

                if (!response.ok) {
                    let errorMessage =
                        `Request failed with status ${response.status}`;

                    try {
                        const errorData =
                            await response.json();

                        errorMessage =
                            errorData.detail ||
                            errorData.message ||
                            errorMessage;
                    } catch (parseError) {
                        console.error(
                            "Could not parse error response:",
                            parseError
                        );
                    }

                    throw new Error(errorMessage);
                }

                showSubmissionStatus(
                    card,
                    "Answer submitted successfully.",
                    true
                );

                /*
                 * Remove the successfully handled case
                 * after a short delay.
                 */
                setTimeout(function () {
                    card.remove();

                    const pendingCasesContainer =
                        document.getElementById(
                            "pending-cases"
                        );

                    if (
                        pendingCasesContainer.children.length === 0
                    ) {
                        pendingCasesContainer.innerHTML =
                            '<div class="empty-message">' +
                            'No pending cases found.' +
                            '</div>';
                    }
                }, 1000);
            } catch (error) {
                console.error(
                    "Failed to submit pending case:",
                    error
                );

                showSubmissionStatus(
                    card,
                    "Unable to submit answer: " +
                    error.message,
                    false
                );

                submitButton.disabled = false;
                answerInput.disabled = false;
                submitButton.textContent = "Submit Answer";
            }
        }

        /*
         * Display success or error feedback inside
         * the pending-case card.
         */
        function showSubmissionStatus(
            card,
            message,
            isSuccess
        ) {
            const statusElement =
                document.createElement("div");

            statusElement.className =
                "submission-status " +
                (isSuccess ? "success" : "submission-error");

            statusElement.textContent = message;

            card.appendChild(statusElement);
        }

        // Load pending cases when the page opens
        window.addEventListener(
            "DOMContentLoaded",
            function () {
                getPendingCases();
            }
        );
    </script>

</body>

</html>
